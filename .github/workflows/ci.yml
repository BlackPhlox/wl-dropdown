name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev \
            sway grim fonts-dejavu-core

      # Pinned so a new stable release cannot fail the build with lints
      # that did not exist when the code was written. Bump deliberately.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit, behaviour and screenshot tests
        run: cargo test --all-features

      - name: End-to-end screenshots (headless sway)
        run: scripts/e2e-screenshot.sh

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            target/snapshots
            target/e2e
